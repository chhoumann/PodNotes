name: Test
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "master"

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint and format
            run: npm run lint && npm run format:check
          - name: Build and sizes
            run: npm run build && npm run size && npm run size:data
          - name: Unit tests
            run: npm run test:unit
          - name: Svelte checks and tooling tests
            run: npm run check:a11y && npm run test:tooling
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  # A skipped required check counts as passing.
  test:
    name: Test
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.check.result }}
