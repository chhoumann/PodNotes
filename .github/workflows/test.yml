# CI3 baseline timing control.
name: Test
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "master"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check and build
        run: npm run build
      - name: Bundle and persistence sizes
        run: npm run size && npm run size:data
      - name: Run tests
        run: npm run test
      - name: Check tooling failures
        run: npm run test:tooling
